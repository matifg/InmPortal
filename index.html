    <meta name="theme-color" content="#0f172a" />
    <script>
      // Antes del CSS: un script inline posterior a la hoja de estilos espera a que termine de bajar.
      if (location.pathname === '/' || location.pathname === '/propiedades') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = '/images/hero-1280.webp';
        heroPreload.setAttribute('imagesrcset', '/images/hero-768.webp 768w, /images/hero-1280.webp 1280w, /images/hero-1920.webp 1920w');
        heroPreload.setAttribute('imagesizes', '100vw');
        heroPreload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(heroPreload);
      }
    </script>

  <body>
    <div id="root"></div>
    <script>
      // Poster del hero en el primer paint (LCP mobile); React reemplaza este contenido al montar.
      if (location.pathname === '/' || location.pathname === '/propiedades') {
        document.getElementById('root').innerHTML =
          '<div aria-hidden="true">' +
          '<div style="height:64px;background:#0f172b;border-bottom:1px solid #1d293d"></div>' +
